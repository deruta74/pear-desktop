name: Rust preview native QA

on:
  push:
    branches: [experiment/rust-windows-qa]

permissions:
  contents: read

jobs:
  native-preview:
    if: github.repository == 'deruta74/pear-desktop'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: experiments/rust-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - name: Build preview and run Rust tests on MSVC
        id: build
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $artifactDir = Join-Path $env:RUNNER_TEMP 'pear-windows-qa'
          New-Item $artifactDir -ItemType Directory -Force | Out-Null
          $log = Join-Path $artifactDir 'qa.log'
          $target = 'x86_64-pc-windows-msvc'
          $toolchain = "stable-$target"
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'pear-rust-target'
          $env:CARGO_TERM_COLOR = 'never'

          function Invoke-Rustup {
            & rustup @args 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) {
              throw "rustup $($args -join ' ') failed with exit code $LASTEXITCODE."
            }
          }

          Invoke-Rustup toolchain install $toolchain --profile minimal
          Invoke-Rustup run $toolchain rustc --version
          Invoke-Rustup run $toolchain cargo build --locked --target $target --release -p pear-desktop-preview
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR "$target/release/pear-desktop-preview.exe") $artifactDir
          'portable=true' >> $env:GITHUB_OUTPUT
          Invoke-Rustup run $toolchain cargo test --locked --target $target --workspace --all-features
          Invoke-Rustup run $toolchain cargo build --locked --target $target --features benchmark -p pear-desktop-preview
      - name: Run the native WebView2 queue smoke
        timeout-minutes: 3
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'pear-windows-qa'
          $log = Join-Path $artifactDir 'qa.log'
          $stdout = Join-Path $artifactDir 'queue.stdout.log'
          $stderr = Join-Path $artifactDir 'queue.stderr.log'
          $preview = $null
          try {
            $webView2Client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            $runtimePaths = @(
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$webView2Client"
              "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$webView2Client"
            )
            $runtime = Get-ItemPropertyValue -LiteralPath $runtimePaths -Name pv -ErrorAction SilentlyContinue |
              Where-Object { ($_ -as [version]) -gt [version]'0.0.0.0' } |
              Select-Object -First 1
            if (-not $runtime) {
              throw 'Microsoft Edge WebView2 Evergreen Runtime is missing on the Windows runner.'
            }
            "WebView2 Evergreen Runtime $runtime" | Tee-Object -FilePath $log -Append

            $queueDir = Join-Path $env:RUNNER_TEMP "pear-queue-$([guid]::NewGuid().ToString('N'))"
            New-Item $queueDir -ItemType Directory | Out-Null
            $env:PEAR_PREVIEW_QUEUE_DIR = $queueDir
            '{"entries":["M7lc1UVf-VE"],"current":"M7lc1UVf-VE","titles":{}}' |
              Set-Content -LiteralPath (Join-Path $queueDir 'queue.json') -Encoding utf8

            $exe = Join-Path $env:RUNNER_TEMP 'pear-rust-target/x86_64-pc-windows-msvc/debug/pear-desktop-preview.exe'
            $preview = Start-Process -FilePath $exe -ArgumentList '--queue-smoke' -WorkingDirectory $queueDir `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $ready = $false
            $title = $false
            $deadline = [TimeSpan]::FromSeconds(45)
            while ($clock.Elapsed -lt $deadline) {
              if ($preview.WaitForExit(0)) {
                throw "Preview PID $($preview.Id) exited during the smoke check with code $($preview.ExitCode)."
              }
              $lines = Get-Content -LiteralPath $stdout
              if (-not $ready -and $lines -ccontains 'PEAR_QUEUE_READY') {
                $ready = $true
                $deadline = $clock.Elapsed + [TimeSpan]::FromSeconds(20)
                'Observed PEAR_QUEUE_READY from the local queue controls.' | Tee-Object -FilePath $log -Append
              }
              $title = $lines -ccontains 'PEAR_QUEUE_VIDEO_TITLE'
              if ($ready -and $title) { break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              throw 'The preview did not emit the exact PEAR_QUEUE_READY line within 45 seconds.'
            }
            if ($title) {
              'Observed PEAR_QUEUE_VIDEO_TITLE for the seeded video.' | Tee-Object -FilePath $log -Append
            } else {
              'PEAR_QUEUE_VIDEO_TITLE was not observed during the smoke check.' | Tee-Object -FilePath $log -Append
            }
          } catch {
            "Queue smoke failed: $($_.Exception.Message)" | Tee-Object -FilePath $log -Append
            throw
          } finally {
            if ($null -ne $preview) {
              try {
                $forced = $false
                if (-not $preview.HasExited) {
                  if (-not $preview.CloseMainWindow() -or -not $preview.WaitForExit(3000)) {
                    if (-not $preview.HasExited) {
                      $preview.Kill()
                      $forced = $true
                    }
                  }
                }
                if (-not $preview.WaitForExit(5000)) {
                  throw "Preview PID $($preview.Id) did not exit after cleanup."
                }
                $exitCode = $preview.ExitCode
                # Kill() on Windows requests exit code -1. Preserve any other exit failure.
                if ($exitCode -ne 0 -and -not ($forced -and $exitCode -eq -1)) {
                  throw "Preview PID $($preview.Id) exited with code $exitCode."
                }
                "Preview PID $($preview.Id) exited with code $exitCode (forced cleanup: $forced)." |
                  Tee-Object -FilePath $log -Append
              } finally {
                $preview.Dispose()
              }
            }
          }
      - name: Verify the packaged preview first launch without arguments
        timeout-minutes: 2
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'pear-windows-qa'
          $log = Join-Path $artifactDir 'qa.log'
          $queueDir = Join-Path $env:RUNNER_TEMP "pear-package-queue-$([guid]::NewGuid().ToString('N'))"
          $lock = Join-Path $queueDir 'queue.lock'
          $consent = Join-Path $queueDir 'consent.json'
          $preview = $null
          try {
            $null = New-Item -ItemType Directory -Path $queueDir
            $options = [Diagnostics.ProcessStartInfo]::new()
            $options.FileName = Join-Path $artifactDir 'pear-desktop-preview.exe'
            $options.WorkingDirectory = $queueDir
            $options.UseShellExecute = $false
            $options.RedirectStandardOutput = $true
            $options.RedirectStandardError = $true
            $options.Environment['PEAR_PREVIEW_QUEUE_DIR'] = $queueDir
            $null = $options.Environment.Remove('PEAR_YOUTUBE_API_KEY_FILE')
            $preview = [Diagnostics.Process]::Start($options)
            $stdout = $preview.StandardOutput.BaseStream.CopyToAsync([IO.Stream]::Null)
            $stderr = $preview.StandardError.BaseStream.CopyToAsync([IO.Stream]::Null)

            $clock = [Diagnostics.Stopwatch]::StartNew()
            $readySince = $null
            $confirmed = $false
            while ($clock.Elapsed.TotalSeconds -lt 30) {
              if ($preview.HasExited) { throw "Packaged preview exited during startup with code $($preview.ExitCode)." }
              if (Test-Path -LiteralPath $consent) { throw 'Packaged preview recorded consent without acceptance.' }
              $preview.Refresh()
              $window = $preview.MainWindowHandle -ne [IntPtr]::Zero -and
                $preview.MainWindowTitle -ceq 'Pear Desktop Rust Preview' -and $preview.Responding
              if ($window -and (Test-Path -LiteralPath $lock -PathType Leaf)) {
                if ($null -eq $readySince) { $readySince = $clock.Elapsed }
                if (($clock.Elapsed - $readySince).TotalSeconds -ge 1) {
                  $confirmed = $true
                  break
                }
              } else {
                $readySince = $null
              }
              Start-Sleep -Milliseconds 250
            }
            if (!$confirmed -or $preview.HasExited) {
              throw 'Packaged preview did not keep a responsive window and queue.lock alive.'
            }
          } finally {
            if ($null -ne $preview) {
              try {
                $forced = $false
                if (!$preview.HasExited -and (!$preview.CloseMainWindow() -or !$preview.WaitForExit(3000))) {
                  if (!$preview.HasExited) {
                    $preview.Kill()
                    $forced = $true
                  }
                }
                if (!$preview.WaitForExit(5000)) { throw 'Packaged preview did not exit after cleanup.' }
                if ($preview.ExitCode -ne 0 -and !($forced -and $preview.ExitCode -eq -1)) {
                  throw "Packaged preview exited with code $($preview.ExitCode)."
                }
              } finally {
                $preview.Dispose()
              }
            }
          }
          if (Test-Path -LiteralPath $consent) { throw 'Packaged preview recorded consent without acceptance.' }
          'PEAR_WINDOWS_PACKAGE_SMOKE queue_lock=true responsive_window=true consent_created=false' |
            Tee-Object -FilePath $log -Append
          $hash = (Get-FileHash -LiteralPath $options.FileName -Algorithm SHA256).Hash.ToLowerInvariant()
          "PEAR_WINDOWS_PACKAGE_SHA256 $hash" | Tee-Object -FilePath $log -Append
      - name: Run the native WebView2 IFrame smoke
        timeout-minutes: 3
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'pear-windows-qa'
          $log = Join-Path $artifactDir 'qa.log'
          $stdout = Join-Path $artifactDir 'iframe.stdout.log'
          $stderr = Join-Path $artifactDir 'iframe.stderr.log'
          $queueDir = Join-Path $env:RUNNER_TEMP "pear-iframe-$([guid]::NewGuid().ToString('N'))"
          $rawOut = Join-Path $queueDir 'stdout.log'
          $rawErr = Join-Path $queueDir 'stderr.log'
          $preview = $null
          $queueReady = $false
          $transportReady = $false
          $responsiveWindow = $false
          try {
            $null = New-Item -ItemType File -Path $stdout, $stderr -Force
            $null = New-Item -ItemType Directory -Path $queueDir
            # Seed the video used in YouTube's IFrame API documentation.
            '{"entries":["M7lc1UVf-VE"],"current":"M7lc1UVf-VE","titles":{}}' |
              Set-Content -LiteralPath (Join-Path $queueDir 'queue.json') -Encoding utf8

            $exe = Join-Path $env:RUNNER_TEMP 'pear-rust-target/x86_64-pc-windows-msvc/debug/pear-desktop-preview.exe'
            $preview = Start-Process -FilePath $exe -ArgumentList '--iframe-player-smoke' -WorkingDirectory $queueDir `
              -Environment @{ PEAR_PREVIEW_QUEUE_DIR = $queueDir; PEAR_YOUTUBE_API_KEY_FILE = $null } `
              -RedirectStandardOutput $rawOut -RedirectStandardError $rawErr -PassThru
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $deadline = [TimeSpan]::FromSeconds(45)
            while ($clock.Elapsed -lt $deadline) {
              if ($preview.WaitForExit(0)) {
                throw "IFrame preview exited during smoke with code $($preview.ExitCode)."
              }
              $lines = Get-Content -LiteralPath $rawOut -TotalCount 128
              if (!$queueReady -and $lines -ccontains 'PEAR_QUEUE_READY') {
                $queueReady = $true
                $deadline = $clock.Elapsed + [TimeSpan]::FromSeconds(25)
              }
              $transportReady = $lines -ccontains 'PEAR_QUEUE_TRANSPORT_READY'
              $preview.Refresh()
              $responsiveWindow = $responsiveWindow -or
                ($preview.MainWindowHandle -ne [IntPtr]::Zero -and $preview.Responding)
              if ($queueReady -and $transportReady) { break }
              Start-Sleep -Milliseconds 250
            }
            if (!$queueReady) {
              throw 'The IFrame preview did not emit the exact PEAR_QUEUE_READY line within 45 seconds.'
            }
            if (!$transportReady) {
              Write-Host '::warning title=YouTube IFrame readiness::The exact PEAR_QUEUE_TRANSPORT_READY line was not observed. This check depends on YouTube API availability on the hosted runner.'
            }
          } finally {
            try {
              if ($null -ne $preview) {
                try {
                  $forced = $false
                  if (!$preview.HasExited -and (!$preview.CloseMainWindow() -or !$preview.WaitForExit(3000))) {
                    if (!$preview.HasExited) {
                      $preview.Kill($true)
                      $forced = $true
                    }
                  }
                  if (!$preview.WaitForExit(5000)) {
                    throw 'The IFrame preview did not exit after cleanup.'
                  }
                  $exitCode = $preview.ExitCode
                  "IFrame preview exit_code=$exitCode forced_cleanup=$forced" | Tee-Object -FilePath $log -Append
                  if ($exitCode -ne 0 -and !($forced -and $exitCode -eq -1)) {
                    throw "The IFrame preview exited with code $exitCode."
                  }
                } finally {
                  $preview.Dispose()
                }
              }
            } finally {
              # Preserve fixed markers and diagnostic categories without publishing raw process text.
              $markers = @('PEAR_QUEUE_READY', 'PEAR_QUEUE_TRANSPORT_READY')
              if (Test-Path -LiteralPath $rawOut -PathType Leaf) {
                foreach ($line in (Get-Content -LiteralPath $rawOut -TotalCount 128)) {
                  if ($markers -ccontains $line) {
                    Add-Content -LiteralPath $stdout -Value $line
                  } else {
                    Add-Content -LiteralPath $stdout -Value '[redacted stdout line]'
                  }
                }
              }
              if (Test-Path -LiteralPath $rawErr -PathType Leaf) {
                foreach ($line in (Get-Content -LiteralPath $rawErr -TotalCount 128)) {
                  if ($line -cmatch '^(Could not (?:read player state|update the queue controls|update the playback controls|arrange the player)|Queue smoke check failed|Error):') {
                    Add-Content -LiteralPath $stderr -Value "$($Matches[1]): [details redacted]"
                  } else {
                    Add-Content -LiteralPath $stderr -Value '[redacted stderr line]'
                  }
                }
              }
              "PEAR_WINDOWS_IFRAME_SMOKE queue_ready=$($queueReady.ToString().ToLowerInvariant()) transport_ready=$($transportReady.ToString().ToLowerInvariant()) responsive_window=$($responsiveWindow.ToString().ToLowerInvariant())" |
                Tee-Object -FilePath $log -Append
              if (Test-Path -LiteralPath $queueDir -PathType Container) {
                try {
                  Remove-Item -LiteralPath $queueDir -Recurse -Force
                } catch {
                  Write-Warning 'The runner will finish cleaning up the disposable IFrame directory.'
                }
              }
            }
          }
      - name: Probe visible IFrame playback with a diagnostic build
        if: ${{ contains(github.event.head_commit.message, '[webview2-iframe-playback]') }}
        timeout-minutes: 10
        run: ./tools/windows-iframe-playback-qa.ps1
      - name: Upload Windows QA logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pear-rust-windows-qa-logs
          path: |
            ${{ runner.temp }}/pear-windows-qa/qa.log
            ${{ runner.temp }}/pear-windows-qa/queue.stdout.log
            ${{ runner.temp }}/pear-windows-qa/queue.stderr.log
            ${{ runner.temp }}/pear-windows-qa/iframe.stdout.log
            ${{ runner.temp }}/pear-windows-qa/iframe.stderr.log
      - name: Upload the regular Windows preview executable
        if: ${{ !cancelled() && steps.build.outputs.portable == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pear-rust-preview-windows-x64
          path: ${{ runner.temp }}/pear-windows-qa/pear-desktop-preview.exe
          if-no-files-found: error

  native-preview-linux:
    if: github.repository == 'deruta74/pear-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      LC_ALL: C
    defaults:
      run:
        shell: bash
        working-directory: experiments/rust-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - name: Install native build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev xvfb xauth x11-utils dbus-daemon
      - name: Build and test the Rust preview on Linux x64
        run: |
          test "$(uname -m)" = x86_64
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pear-rust-linux-target"
          printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          artifact_dir="$RUNNER_TEMP/pear-linux-qa"
          mkdir -p "$artifact_dir"
          exec > >(tee -a "$artifact_dir/qa.log") 2>&1
          target=x86_64-unknown-linux-gnu
          toolchain="stable-$target"
          git rev-parse HEAD
          node --version
          dpkg-query -W libgtk-3-0t64 libwebkit2gtk-4.1-0 libssl3t64
          rustup toolchain install "$toolchain" --profile minimal
          rustup run "$toolchain" rustc --version
          rustup run "$toolchain" cargo test --locked --target "$target" --workspace --all-features
          rustup run "$toolchain" cargo build --locked --target "$target" --release -p pear-desktop-preview
      - name: Inspect the release binary and stage the Linux package
        run: |
          artifact_dir="$RUNNER_TEMP/pear-linux-qa"
          package_dir="$artifact_dir/pear-rust-preview-linux-x64"
          mkdir -p "$package_dir"
          exe="$package_dir/pear-desktop-preview"
          install -m 0755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/pear-desktop-preview" "$exe"
          readelf -h "$exe" | tee "$artifact_dir/release.elf.txt"
          grep -Eq '^ *Class: +ELF64$' "$artifact_dir/release.elf.txt"
          grep -Eq '^ *Machine: +Advanced Micro Devices X86-64$' "$artifact_dir/release.elf.txt"
          ldd "$exe" | tee "$artifact_dir/release.ldd.txt"
          if grep -Eq '=>[[:space:]]+not found' "$artifact_dir/release.ldd.txt"; then
            exit 1
          fi
          for dependency in libgtk-3.so.0 libwebkit2gtk-4.1.so.0 libssl.so.3; do
            grep -Fq "$dependency => /" "$artifact_dir/release.ldd.txt"
          done
          hash=$(sha256sum "$exe")
          printf 'PEAR_LINUX_PACKAGE_SHA256 %s\n' "${hash%% *}" | tee -a "$artifact_dir/qa.log"
          cp README.md "$package_dir/README.md"
          cat > "$package_dir/START.md" <<'START'
          # Run Pear Desktop Rust Preview on Ubuntu 24.04 x64

          Install the runtime libraries, extract the archive, and start the app from a desktop session.

          ```sh
          sudo apt install libgtk-3-0t64 libwebkit2gtk-4.1-0 libssl3t64
          tar -xzf pear-rust-preview-linux-x64.tar.gz
          cd pear-rust-preview-linux-x64
          ./pear-desktop-preview
          ```

          Review the terms and privacy policy before enabling YouTube services.
          START
      - name: Verify packaged first launch under Xvfb without arguments
        timeout-minutes: 2
        run: |
          artifact_dir="$RUNNER_TEMP/pear-linux-qa"
          exe="$artifact_dir/pear-rust-preview-linux-x64/pear-desktop-preview"
          profile=$(mktemp -d "$RUNNER_TEMP/pear-linux-first-launch.XXXXXX")
          trap 'rm -rf -- "$profile"' EXIT
          printf '%s\n' '{"entries":["M7lc1UVf-VE"],"current":"M7lc1UVf-VE","titles":{}}' > "$profile/queue.json"
          sha256sum "$profile/queue.json" > "$profile/fixture.sha256"
          timeout --kill-after=5s 50s dbus-run-session -- xvfb-run -a bash -s -- "$exe" "$profile" "$artifact_dir" <<'SMOKE'
          set -euo pipefail
          exe=$1
          profile=$2
          artifact_dir=$3
          env -u PEAR_YOUTUBE_API_KEY_FILE \
            PEAR_PREVIEW_QUEUE_DIR="$profile" XDG_CACHE_HOME="$profile/cache" \
            XDG_CONFIG_HOME="$profile/config" XDG_DATA_HOME="$profile/data" GDK_BACKEND=x11 \
            "$exe" > "$artifact_dir/first-launch.stdout.log" 2> "$artifact_dir/first-launch.stderr.log" &
          preview_pid=$!
          cleanup() {
            kill -TERM "$preview_pid" 2>/dev/null || true
            for _ in {1..20}; do
              kill -0 "$preview_pid" 2>/dev/null || break
              sleep 0.1
            done
            kill -KILL "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" || true
          }
          trap cleanup EXIT
          trap 'trap - EXIT; cleanup; exit 124' TERM

          for _ in {1..120}; do
            kill -0 "$preview_pid"
            test ! -e "$profile/consent.json"
            xwininfo -root -tree > "$profile/windows.txt"
            if test -f "$profile/queue.lock" && grep -Fq '"Pear Desktop Rust Preview"' "$profile/windows.txt"; then
              sleep 1
              kill -0 "$preview_pid"
              xwininfo -root -tree > "$profile/windows.txt"
              grep -Fq '"Pear Desktop Rust Preview"' "$profile/windows.txt"
              exit 0
            fi
            sleep 0.25
          done
          echo 'The packaged preview did not open a window and create queue.lock.' >&2
          exit 1
          SMOKE
          sha256sum --check --status "$profile/fixture.sha256"
          test ! -e "$profile/consent.json"
          echo 'PEAR_LINUX_PACKAGE_SMOKE queue_lock=true window=true fixture_unchanged=true consent_created=false' |
            tee -a "$artifact_dir/qa.log"
      - name: Package the verified Linux preview
        run: |
          artifact_dir="$RUNNER_TEMP/pear-linux-qa"
          cd "$artifact_dir"
          package=pear-rust-preview-linux-x64
          tar -czf "$package.tar.gz" "$package"
          tar -tzf "$package.tar.gz"
          tar -xOf "$package.tar.gz" "$package/pear-desktop-preview" | cmp - "$package/pear-desktop-preview"
          sha256sum "$package.tar.gz" | tee "$package.tar.gz.sha256"
      - name: Upload Linux QA logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pear-rust-linux-qa-logs
          path: |
            ${{ runner.temp }}/pear-linux-qa/qa.log
            ${{ runner.temp }}/pear-linux-qa/release.elf.txt
            ${{ runner.temp }}/pear-linux-qa/release.ldd.txt
            ${{ runner.temp }}/pear-linux-qa/first-launch.stdout.log
            ${{ runner.temp }}/pear-linux-qa/first-launch.stderr.log
      - name: Upload the verified Linux x64 package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pear-rust-preview-linux-x64
          path: |
            ${{ runner.temp }}/pear-linux-qa/pear-rust-preview-linux-x64.tar.gz
            ${{ runner.temp }}/pear-linux-qa/pear-rust-preview-linux-x64.tar.gz.sha256
          if-no-files-found: error
