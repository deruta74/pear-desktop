name: Source module identity once

on:
  push:
    branches: [diagnostic/windows-fixture-module-identity-oct28]

permissions:
  contents: read

jobs:
  source-module-identity:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.22.0
      - run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - run: node scripts/source-module-identity-probe.mjs
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: source-module-identity-result
          path: source-module-identity-result.json
          if-no-files-found: warn
          retention-days: 7
