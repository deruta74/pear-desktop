# Target route in selected diagnostic carrier: .github/workflows/tests.yml
# Historical registered ID 376634247 must be freshly resolved by Root.
# SOURCE PROPOSAL ONLY. Helper/policy exist; unknown tool pins reject.
# d0/947/946 are planning references; Root must refresh stable release-source pins.
# Root must select/review/seal the actual carrier and explicitly replace if:false.
# No Windows/C6 paths. This workflow must not be merged into product.
name: Proposed current POSIX API qualification r2
on:
  workflow_dispatch:
    inputs:
      expected_carrier_sha: {type: string, required: true}
      expected_carrier_tree: {type: string, required: true}
      expected_ref: {type: string, required: true}
      expected_registered_workflow_id: {type: string, required: true}
      expected_workflow_sha256: {type: string, required: true}
      expected_helper_sha256: {type: string, required: true}
      expected_policy_sha256: {type: string, required: true}
permissions:
  contents: read
  actions: read
concurrency:
  group: proposed-current-posix-api-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' }} # Deliberate source-only dispatch barrier.
    name: current-posix-api-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, arch: x64}
          - {os: macos-26, platform: darwin, arch: arm64}
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_CARRIER_SHA: ${{ inputs.expected_carrier_sha }}
      EXPECTED_CARRIER_TREE: ${{ inputs.expected_carrier_tree }}
      EXPECTED_REF: ${{ inputs.expected_ref }}
      EXPECTED_REGISTERED_WORKFLOW_ID: ${{ inputs.expected_registered_workflow_id }}
      EXPECTED_WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
      EXPECTED_HELPER_SHA256: ${{ inputs.expected_helper_sha256 }}
      EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
      PEAR_SOURCE_ROOT: ${{ github.workspace }}/qualified-source
      PEAR_POSIX_PLATFORM: ${{ matrix.platform }}
      PEAR_POSIX_ARCH: ${{ matrix.arch }}
      NODE_OPTIONS: ''
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout separately selected carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 1
        with:
          ref: ${{ inputs.expected_carrier_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Checkout exact qualified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 1
        with:
          ref: d0ccbce0efb793bfec48095c25d6f32791e5654a
          path: qualified-source
          persist-credentials: false
          fetch-depth: 1
      # Bootstrap trust: hosted image shell/Git/ambient Node + SHA-pinned actions.
      # bind-source performs no project install, topology query or qualification.
      - name: Bind reviewed carrier/source/image before tool setup
        timeout-minutes: 1
        run: node scripts/api-music-posix-carrier.cjs bind-source
      - name: Provision exact admitted Node patch
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        timeout-minutes: 2
        with:
          node-version: 24.22.0
          architecture: ${{ matrix.arch }}
          check-latest: false
      - name: Verify Node/image and establish owned private root
        timeout-minutes: 1
        run: node scripts/api-music-posix-carrier.cjs prepare
      - name: Provision exact pnpm without project installation
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        timeout-minutes: 1
        with:
          version: 11.28.6
          run_install: false
      - name: Verify pnpm and run one bounded isolated frozen install
        timeout-minutes: 4
        run: node scripts/api-music-posix-carrier.cjs install
      - name: Fixed accepted qualifier and strict safe draft
        timeout-minutes: 4
        env:
          PEAR_API_TOKEN: ${{ github.token }}
        run: node scripts/api-music-posix-carrier.cjs qualify
      - name: Bounded owned cleanup and final safe result
        if: always()
        timeout-minutes: 1
        run: node scripts/api-music-posix-carrier.cjs cleanup
      - name: Upload only reconstructed final safe result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        timeout-minutes: 1
        with:
          name: current-posix-api-${{ matrix.platform }}-safe-result
          path: api-music-posix-safe/result.json
          if-no-files-found: error
          retention-days: 1
# The helper reads bounded live GitHub run/jobs metadata before qualifier spawn.
# Runtime envelope is allocated after dispatch; static policy has no run/job fields.
# always() is not guaranteed after termination; absent final artifact = zero cells.
# Inherited inner rm may already have run; withhold only further outer deletion on uncertainty.
# A filesystem watchdog bounds waiting, not cancellation of recursive removal.
# Job termination supplies the declared hosted-VM outer boundary.
# Neither normal close nor a timer proves descendant/process absence or VM reap.
