name: Native runner diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-private-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.x
      - name: Probe original lexical gate and normalized candidate
        run: node scripts/windows-private-native-diagnostic.cjs
  windows-grants:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install test browser
        run: pnpm exec playwright install chromium
      - name: Verify native ledger and mandatory real aliases
        run: pnpm exec playwright test tests/api-music-grants.test.ts --workers=1 --reporter=line
