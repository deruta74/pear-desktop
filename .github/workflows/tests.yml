              'roots' {return ,@($Value|ForEach-Object{ProjectEvidenceValue $_ 'root'})}
              'reportPath' {
                $path=AssertMatch $Value '\A[A-Za-z]:[\\/][^\x00-\x1F]*\z';$path=$path.Replace('/','\')
                $base=$script:EvidenceReportRoot.TrimEnd('\');$matched=$false
                foreach($leaf in @('SCROBBLER-WINDOWS-EBUSY-preload.cjs','playwright-output')){if([string]::Equals($base+'\'+$leaf,$path,[StringComparison]::OrdinalIgnoreCase)){$matched=$true}}
                if(-not $matched){throw 'Unowned report path.'};return $path
              }
              'version' {return AssertMatch $Value '\Av?[0-9]{1,3}(?:\.[0-9]{1,6}){1,3}\z'}
              'os' {return AssertMatch $Value '\A(?:Microsoft )?Windows NT [0-9.]+\z'}
              'image' {return AssertMatch $Value '\Awin[0-9]{2}-vs[0-9]{4}\z'}
              'imageVersion' {return AssertMatch $Value '\A[0-9.]{1,40}\z'}
              'manifestFile' {return AssertEnum $Value @('preflight-source-manifest.json')}
              'opaqueSchema' {return AssertEnum $Value @('sha256-path-v1')}
              'signature' {return AssertEnum $Value @('Valid')}
              'testFile' {return AssertEnum $Value @('tests/api-music-collections-native.test.ts')}
              'testTitle' {return AssertEnum $Value @('F2 actual native canceled-job and capture reentry preserve adopted source artifacts')}
              'method' {return AssertEnum $Value @('GetLongPathNameW-read-only-metadata')}
              'validationError' {return AssertEnum $Value @('resolved-root-scope-mismatch')}
              'mode' {return AssertEnum $Value @('PreflightOnly','host-node-carrier-only','discovery-only','focused-only')}
              'platform' {return AssertEnum $Value @('win32')}
              'phase' {return AssertEnum $Value @('fixture-created','fixture-launcher-spawn','rm-begin','rm-reject','first-ebusy-plus-1s')}
              'stage' {return AssertEnum $Value @('ready','task','shutdown','other','add-type','source-scope','source-before','diagnostic-file-copy','resolved-environment','carrier-environment','carrier-exit-zero','carrier-exit-seven','focused-discovery','handle-provision','collector-start','collector-ready-wait','focused','source-after','diagnostic-health-after','preflight-report-scope','preflight-source-manifest','preflight-expected-source-sha256')}
              'outcome' {return AssertEnum $Value @('not-attempted','launching','waiting','ready-admitted','collector-exited','late-ready-rejected','admission-timeout','startup-error')}
              'status' {return AssertEnum $Value @('started','succeeded','failed','resolved','unavailable','running','passed','timedOut','timedout','skipped','interrupted','invalid')}
              'errorType' {return AssertEnum $Value @('music-diagnostic-error','Win32Exception','IOException','UnauthorizedAccessException','DirectoryNotFoundException','FileNotFoundException','InvalidOperationException','ArgumentException','ArgumentNullException','ObjectDisposedException','TimeoutException','TaskCanceledException','OperationCanceledException','RuntimeException','MethodInvocationException','JsonException','JsonReaderException','FormatException','NotSupportedException','InvalidDataException','EntryPointNotFoundException')}
              'exe' {if($Value -isnot [string]){throw 'Invalid executable label.'};return AssertEnum $Value.ToLowerInvariant() @('electron.exe','cmd.exe','conhost.exe','powershell.exe','pwsh.exe','handle64.exe','handle.exe','crashpad_handler.exe','werfault.exe','wermgr.exe','shell-launch','unknown-executable')}
              'role' {return AssertEnum $Value @('renderer','gpu-process','utility','zygote','broker','crashpad-handler')}
              'signal' {return AssertEnum $Value @('SIGTERM','SIGKILL','SIGINT','SIGABRT','SIGSEGV')}
              'operation' {return AssertMatch $Value '\A[0-9]+:[0-9]+\z'}
              'identity' {return AssertMatch $Value '\A[0-9]+\|[0-9TZ:.\-]+\z'}
              'handleStdout' {return AssertMatch $Value '\Ahandle-[a-f0-9]{32}\.stdout\.log\z'}
              'handleStderr' {return AssertMatch $Value '\Ahandle-[a-f0-9]{32}\.stderr\.log\z'}
              'errorClass' {return AssertEnum $Value @('missing-owned-reentry-observation','explicit-menu-copy-missing','unexpected-recipe','unexpected-native-remote-request','unclassified-native-error')}
              'parserCode' {return AssertEnum $Value @('created-root-scope','duplicate-result','result-json','result-object','result-fields','missing-stream','stream-type','stream-frame','stream-overflow','stream-observer','incomplete-stream-line','observer-init')}
              'fsCode' {return AssertEnum $Value @('EBUSY','ENOTEMPTY','ENOENT','EPERM','EACCES','EIO','EINVAL','unclassified-fs-error')}
              'errorName' {return AssertEnum $Value @('Error','unclassified-error')}
              'syscall' {return AssertEnum $Value @('rmdir','unlink','scandir','rm')}
              'workerEvent' {return AssertEnum $Value @($script:EvidenceSchemas.profiles.Keys|Where-Object{$_.StartsWith('w:')}|ForEach-Object{$_.Substring(2)})}
              'reporterEvent' {return AssertEnum $Value @('test-begin','test-end','run-end','protocol-error')}
              'errorCountOne' {if($Value -isnot [string]){throw 'Invalid error marker.'};return 1}
              'errorCount' {if($Value -isnot [array]){throw 'Invalid error array.'};foreach($v in $Value){if($v -isnot [string]){throw 'Invalid error entry.'}};return $Value.Count}
              'sourceErrors' {return ,@($Value|ForEach-Object{AssertEnum $_ @('head-query','tree-query','tracked-list','tracked-file-hash','tracked-path-identity-collision-or-duplicate','status-protocol','status-query','trusted-source-manifest')})}
              'entries' {
                if($Value -isnot [array] -or $Value.Count -gt 200){throw 'Invalid inventory entries.'};$dirs=0;$reparse=0
                foreach($item in $Value){if($item -isnot [Collections.IDictionary] -or $item.Count -ne 3 -or $item.Keys -cnotcontains 'name' -or $item.Keys -cnotcontains 'directory' -or $item.Keys -cnotcontains 'reparsePoint' -or $item.name -isnot [string] -or $item.directory -isnot [bool] -or $item.reparsePoint -isnot [bool]){throw 'Invalid inventory entry schema.'};if($item.directory){$dirs++};if($item.reparsePoint){$reparse++}}
                return @{observedEntries=$Value.Count;directoryEntries=$dirs;reparseEntries=$reparse;entryNamesRetained=$false}
              }
              {$_ -cin @('canonicals','processes','exclusions')} {
                if($Value -isnot [array]){throw 'Invalid evidence array.'};$target=@{canonicals='canonical';processes='process';exclusions='exclusion'}[$Rule]
                return ,@($Value|ForEach-Object{ProjectEvidence $_ $target})
              }
              {$_ -cin @('knownHashes','opaqueHashes','statusCodes','diagnostics')} {
                if($Value -isnot [Collections.IDictionary]){throw 'Invalid evidence map.'};$safe=[ordered]@{}
                foreach($key in $Value.Keys){
                  if($Rule -ceq 'knownHashes'){if($script:EvidenceSchemas.publicSourceNames -cnotcontains $key){throw 'Unknown public source name.'};$safe[$key]=ProjectEvidenceValue $Value[$key] 'nullable:hex64'}
                  elseif($Rule -ceq 'opaqueHashes'){[void](AssertMatch $key '\Asha256-path-v1:[a-f0-9]{64}\z');$safe[$key]=ProjectEvidenceValue $Value[$key] 'nullable:hex64'}
                  elseif($Rule -ceq 'statusCodes'){[void](AssertMatch $key '\A[ MTADRCU?!]{2}\z');$safe[$key]=ProjectEvidenceValue $Value[$key] 'num'}
                  else{if($script:EvidenceSchemas.diagnostics.Keys -cnotcontains $key -or $Value[$key] -cne $script:EvidenceSchemas.diagnostics[$key]){throw 'Diagnostic byte identity mismatch.'};$safe[$key]=$Value[$key]}
                }
                if($Rule -ceq 'diagnostics' -and $Value.Count -ne 7){throw 'Incomplete diagnostic byte map.'};return $safe
              }
              default {throw 'Unknown projection rule.'}
            }
          }
          function ReadEvidenceFile([string]$Path) {
            $item=Get-Item -LiteralPath $Path -ErrorAction Stop
            if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $item.Length -gt 8388608){throw 'Unsafe evidence file.'}
            $bytes=[IO.File]::ReadAllBytes($Path)
            if($bytes.Length -gt 8388608){throw 'Unsafe evidence file size.'}
            # All unchanged producers write UTF-8 without BOM. No BOM sniffing or UTF-16/32 fallback.
            if(($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) -or
               ($bytes.Length -ge 2 -and (($bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE) -or ($bytes[0] -eq 0xFE -and $bytes[1] -eq 0xFF))) -or
               ($bytes.Length -ge 4 -and $bytes[0] -eq 0 -and $bytes[1] -eq 0 -and $bytes[2] -eq 0xFE -and $bytes[3] -eq 0xFF)){throw 'Evidence BOM is not admitted.'}
            return [Text.UTF8Encoding]::new($false,$true).GetString($bytes)
          }
          function WriteSafeEvidence([string]$Path,$Value) {[IO.File]::WriteAllText($Path,(ConvertTo-Json -InputObject $Value -Depth 40),[Text.UTF8Encoding]::new($false))}
          function StageMusicEvidence([string]$ReportRoot,[string]$EvidenceRoot,[string]$ExpectedHead) {
            $script:EvidenceReportRoot=$ReportRoot.Replace('/',[char]92);$script:EvidenceSchemas=GetBodyEvidenceSchemas
            if(Test-Path -LiteralPath $EvidenceRoot){throw 'Evidence staging directory must be fresh.'}
            [void][IO.Directory]::CreateDirectory($EvidenceRoot)
            $health=@{healthy=$true;rejectedInputs=0;stagedFiles=0;unknownOrExcludedFiles=0;rawHandleOutputRetained=$false;positiveOwnerLineProofRetained=$false}
            $handleSummaries=[Collections.Generic.List[object]]::new()
            $allowed=@($script:EvidenceSchemas.files.Keys)+@('diagnostic-head.txt','focused.exit.txt','collector.exit.txt','focused.safe.jsonl','collector.jsonl')
            foreach($file in @(Get-ChildItem -LiteralPath $ReportRoot -File -ErrorAction SilentlyContinue)) {
              $name=$file.Name
              if($allowed -cnotcontains $name -and $name -cnotmatch '\Aworker-[0-9]+\.jsonl\z'){$health.unknownOrExcludedFiles++;continue}
              try {
                $text=ReadEvidenceFile $file.FullName
                if($script:EvidenceSchemas.files.Keys -ccontains $name){$safe=ProjectEvidenceValue (ReadEvidenceJson $text) $script:EvidenceSchemas.files[$name];WriteSafeEvidence (Join-Path $EvidenceRoot $name) $safe}
                elseif($name -ceq 'diagnostic-head.txt'){$head=$text.Trim();if($head -cne $ExpectedHead -or $head -cnotmatch '\A[a-f0-9]{40}\z'){throw 'Diagnostic head mismatch.'};[IO.File]::WriteAllText((Join-Path $EvidenceRoot $name),$head+"`n")}
                elseif($name.EndsWith('.exit.txt')){$code=$text.Trim();[void](AssertMatch $code '\A-?[0-9]{1,11}\z');[IO.File]::WriteAllText((Join-Path $EvidenceRoot $name),$code+"`n")}
                else {
                  $rows=[Collections.Generic.List[string]]::new();$first=$true;$previous=0
                  foreach($line in $text.Split("`n")){if([string]::IsNullOrWhiteSpace($line)){continue};$row=ReadEvidenceJson $line
                    if($name -ceq 'collector.jsonl'){$profile='c:'+$row.event}
                    elseif($name -ceq 'focused.safe.jsonl'){$profile='reporter'}
                    else{$profile='w:'+$row.event;if($row.hostPid -ne [long]($name.Substring(7).Split('.')[0]) -or $row.sequence -le $previous){throw 'Worker identity/order mismatch.'};if($first -and ($row.event -cne 'preload-ready' -or $row.scope -cne 'music-native-c1-f2')){throw 'Worker scope readiness mismatch.'};$previous=$row.sequence}
                    $safe=ProjectEvidence $row $profile
                    if($profile -ceq 'c:handle-result'){
                      $guid=$row.stdoutFile.Substring(7,32)
                      if($row.stderrFile -cne ('handle-'+$guid+'.stderr.log')){throw 'Handle stream identity mismatch.'}
                      $sizes=@{}
                      foreach($kind in @('stdout','stderr')){
                        $raw=Get-Item -LiteralPath (Join-Path $ReportRoot ('handle-'+$guid+'.'+$kind+'.log')) -ErrorAction Stop
                        if($raw.PSIsContainer -or ($raw.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'Unsafe withheld Handle stream.'}
                        $sizes[$kind+'Bytes']=[long]$raw.Length
                      }
                      [void]$handleSummaries.Add(@{queryId=$guid;queryPid=$safe.queryPid;startedUtc=$safe.startedUtc;endedUtc=$safe.endedUtc;exitCode=$safe.exitCode;timedOut=$safe.timedOut;queryTerminationConfirmed=$safe.queryTerminationConfirmed;errorType=$safe.errorType;request=$safe.request;stdoutBytes=$sizes.stdoutBytes;stderrBytes=$sizes.stderrBytes;rawOutputRetained=$false;positiveOwnerLineProofRetained=$false})
                    }
                    [void]$rows.Add(($safe|ConvertTo-Json -Depth 40 -Compress));$first=$false
                  }
                  if($first){throw 'Empty structured evidence.'};$target=if($name -ceq 'collector.jsonl'){'collector.safe.jsonl'}else{$name}
                  [IO.File]::WriteAllText((Join-Path $EvidenceRoot $target),(($rows -join "`n")+"`n"),[Text.UTF8Encoding]::new($false))
                }
                $health.stagedFiles++
              } catch {$health.healthy=$false;$health.rejectedInputs++}
            }
            foreach($required in @('diagnostic-head.txt','diagnostic-files.json','source-before.json','source-after.json','focused-discovery-health.json','focused.safe.jsonl','focused-stream-health.json','focused.exit.txt','collector.safe.jsonl','collector-health.json','collector-startup.json','music-receipt-health.json','outcome.json')){if(-not (Test-Path -LiteralPath (Join-Path $EvidenceRoot $required))){$health.healthy=$false}}
            WriteSafeEvidence (Join-Path $EvidenceRoot 'staging-health.json') $health
            WriteSafeEvidence (Join-Path $EvidenceRoot 'handle-evidence-summary.json') $handleSummaries.ToArray()
            WriteSafeEvidence (Join-Path $EvidenceRoot 'handle-evidence-limits.json') @{rawStdoutRetained=$false;rawStderrRetained=$false;positiveOwnerLineProofRetained=$false;handleExitAndTimingAreNotOwnerProof=$true;inventoryEntryNamesRetained=$false}
            return [bool]$health.healthy
          }
          $report=Join-Path $env:RUNNER_TEMP 'pear-ebusy-report'
          $evidence=Join-Path $env:RUNNER_TEMP 'pear-music-body-evidence'
          if(-not (StageMusicEvidence $report $evidence $env:EXPECTED_DIAGNOSTIC_HEAD)){exit 1}
      - name: Preserve safe body evidence including staging health
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-music-native-body-${{ github.run_id }}
          path: ${{ runner.temp }}/pear-music-body-evidence
          if-no-files-found: error
          retention-days: 14
