name: Manual Windows collector field ingestion replay

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed signed isolated replay branch commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  field-replay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_REPLAY_HEAD: ${{ inputs.expected_head }}
    steps:
      - name: Checkout exact replay inputs only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.expected_head }}
          path: replay-checkout
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/diagnostics/windows-collector-field-replay
          sparse-checkout-cone-mode: false
      - name: Verify exact dispatch SHA and fixed replay file seal
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_REPLAY_HEAD -cnotmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:EXPECTED_REPLAY_HEAD) { throw 'Replay dispatch must resolve to exact reviewed SHA.' }
          $inputRoot = Join-Path $env:GITHUB_WORKSPACE 'replay-checkout/scripts/diagnostics/windows-collector-field-replay'
          $seal = Get-Content -LiteralPath (Join-Path $inputRoot 'REPLAY-SEAL.json') -Raw | ConvertFrom-Json
          $fixedNames = @('exact-functions.ps1','actual-samples.jsonl','negative-controls.jsonl','SOURCE.json','replay.ps1')
          if (@($seal.filesSha256.PSObject.Properties).Count -ne $fixedNames.Count) { throw 'Unexpected replay seal member count.' }
          foreach ($name in $fixedNames) {
            $expected = $seal.filesSha256.PSObject.Properties[$name]
            if ($null -eq $expected -or (Get-FileHash -LiteralPath (Join-Path $inputRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected.Value) { throw 'Replay fixed input hash mismatch.' }
          }
          $report = Join-Path $env:RUNNER_TEMP 'pear-field-replay'
          [void][IO.Directory]::CreateDirectory($report)
          [IO.File]::WriteAllText((Join-Path $report 'identity.json'),(@{expectedHead=$env:EXPECTED_REPLAY_HEAD; dispatchHead=$env:GITHUB_SHA; scope='sparse replay inputs only'; sealSha256=(Get-FileHash -LiteralPath (Join-Path $inputRoot 'REPLAY-SEAL.json') -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
      - name: Replay exact collector field functions without native work
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'replay-checkout/scripts/diagnostics/windows-collector-field-replay/replay.ps1') -OutputRoot (Join-Path $env:RUNNER_TEMP 'pear-field-replay')
          exit $LASTEXITCODE
      - name: Preserve bounded field replay evidence unconditionally
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-collector-field-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pear-field-replay/identity.json
            ${{ runner.temp }}/pear-field-replay/summary.json
            ${{ runner.temp }}/pear-field-replay/field-replay.jsonl
          if-no-files-found: error
          retention-days: 14
