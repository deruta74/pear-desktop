name: Native runner diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Install virtual display
        run: sudo apt-get install -y xvfb
      - name: Verify native renderer termination and built locale owners
        run: xvfb-run -a pnpm exec playwright test tests/api-music-native.test.ts tests/i18n-built-native.test.ts --workers=1 --reporter=line --repeat-each=2
