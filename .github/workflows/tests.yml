name: Manual Windows grant ACL diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed signed diagnostic commit SHA (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    env:
      EXPECTED_DIAGNOSTIC_HEAD: ${{ inputs.expected_head }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.x
      - name: Verify base, original bodies, command and timeout
        run: node scripts/diagnostics/api-grant-acl-windows.mjs --verify-only
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false
      - name: Frozen CI dependency install (runner only)
        run: pnpm install --frozen-lockfile
      - name: Original, isolation, and matched Q1 concurrency phases
        run: node scripts/diagnostics/api-grant-acl-windows.mjs --collect
      - name: Retain safe per-phase diagnostic evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-grant-acl-diagnostic-${{ github.run_id }}
          path: test-results/windows-grant-acl-diagnostic/*.safe.json
          if-no-files-found: error
          retention-days: 14
