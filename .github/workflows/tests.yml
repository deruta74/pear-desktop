name: PR61 owned CIM latency diagnostic (not regression CI)

on:
  workflow_dispatch:
    inputs:
      expected_carrier_sha:
        description: Exact reviewed signed diagnostic carrier commit (40 hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr61-owned-cim-latency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-cim-latency:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pr61-owned-cim-structure' && github.sha == inputs.expected_carrier_sha
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.21.0
      - name: One bounded owned-only structural observation
        shell: cmd
        run: node .github/diagnostics/pr61-owned-cim-latency.cjs --output "%RUNNER_TEMP%\pr61-owned-cim-latency.json"
      - name: Preserve diagnostic evidence (not PR regression result)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pr61-owned-cim-latency-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr61-owned-cim-latency.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
