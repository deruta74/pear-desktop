name: Manual Windows scrobbler cleanup diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed signed diagnostic branch commit SHA
        required: true
        type: string
      measurement_scope:
        description: Music scope is discovery-only until separately admitted
        required: true
        type: choice
        default: scrobbler-window
        options:
          - scrobbler-window
          - music-native-c1-f2

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_DIAGNOSTIC_HEAD: ${{ inputs.expected_head }}
      MEASUREMENT_SCOPE: ${{ inputs.measurement_scope }}
    steps:
      - name: Checkout reviewed diagnostics only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.expected_head }}
          path: diagnostic-checkout
          persist-credentials: false
      - name: Verify diagnostic checkout and copy outside source
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_DIAGNOSTIC_HEAD -cnotmatch '^[a-f0-9]{40}$') { throw 'Expected diagnostic SHA must be 40 lowercase hexadecimal characters.' }
          $actual = git -C diagnostic-checkout rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_DIAGNOSTIC_HEAD) { throw 'Diagnostic checkout identity mismatch.' }
          $report = Join-Path $env:RUNNER_TEMP 'pear-ebusy-report'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'pear-ebusy-diagnostics'
          New-Item -ItemType Directory -Path $report,$diagnostics | Out-Null
          Copy-Item -Path 'diagnostic-checkout/scripts/diagnostics/scrobbler-ebusy/*' -Destination $diagnostics
          "PEAR_EBUSY_DIAGNOSTIC_ROOT=$diagnostics" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PEAR_EBUSY_ARTIFACT_ROOT=$report" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $actual | Out-File -FilePath (Join-Path $report 'diagnostic-head.txt') -Encoding utf8
      - name: Checkout exact unchanged signed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 1c2319c386e33c4032a4d45a7f77b6fc9ab0dd29
          path: source
          persist-credentials: false
      - name: Exact driver source preflight before dependencies and native work
        run: |
          & (Join-Path $env:PEAR_EBUSY_DIAGNOSTIC_ROOT 'SCROBBLER-WINDOWS-EBUSY-runner.ps1') -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'source') -ReportRoot $env:PEAR_EBUSY_ARTIFACT_ROOT -DiagnosticRoot $env:PEAR_EBUSY_DIAGNOSTIC_ROOT -Scope $env:MEASUREMENT_SCOPE -PreflightOnly
          exit $LASTEXITCODE
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Frozen original dependency install (runner only)
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Original test browser provisioning (runner only)
        working-directory: source
        run: pnpm exec playwright install --with-deps chromium
      - name: Original build (runner only)
        working-directory: source
        run: pnpm build
      - name: Reviewed scrobbler focus or music discovery-only gate
        run: |
          $listOnly = $env:MEASUREMENT_SCOPE -ceq 'music-native-c1-f2'
          & (Join-Path $env:PEAR_EBUSY_DIAGNOSTIC_ROOT 'SCROBBLER-WINDOWS-EBUSY-runner.ps1') -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'source') -ReportRoot $env:PEAR_EBUSY_ARTIFACT_ROOT -DiagnosticRoot $env:PEAR_EBUSY_DIAGNOSTIC_ROOT -Scope $env:MEASUREMENT_SCOPE -ListOnly:$listOnly
          exit $LASTEXITCODE
      - name: Preserve safe raw diagnostic evidence unconditionally
        if: always() && inputs.measurement_scope == 'scrobbler-window'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-scrobbler-ebusy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pear-ebusy-report/*.json
            ${{ runner.temp }}/pear-ebusy-report/*.jsonl
            ${{ runner.temp }}/pear-ebusy-report/*.log
            ${{ runner.temp }}/pear-ebusy-report/*.txt
            ${{ runner.temp }}/pear-ebusy-report/*.diagnostic-error
          if-no-files-found: error
          retention-days: 14
      - name: Preserve only reviewed safe music evidence
        if: always() && inputs.measurement_scope == 'music-native-c1-f2'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-music-native-discovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pear-ebusy-report/preflight-result.json
            ${{ runner.temp }}/pear-ebusy-report/preflight-source-manifest.json
            ${{ runner.temp }}/pear-ebusy-report/source-before.json
            ${{ runner.temp }}/pear-ebusy-report/source-after.json
            ${{ runner.temp }}/pear-ebusy-report/source-verification-error.json
            ${{ runner.temp }}/pear-ebusy-report/driver-error.json
            ${{ runner.temp }}/pear-ebusy-report/diagnostic-files.json
            ${{ runner.temp }}/pear-ebusy-report/resolved-environment.json
            ${{ runner.temp }}/pear-ebusy-report/host-carrier-0.json
            ${{ runner.temp }}/pear-ebusy-report/host-carrier-7.json
            ${{ runner.temp }}/pear-ebusy-report/carrier-health.json
            ${{ runner.temp }}/pear-ebusy-report/focused-discovery-health.json
            ${{ runner.temp }}/pear-ebusy-report/focused-discovery-stream-health.json
            ${{ runner.temp }}/pear-ebusy-report/diagnostic-health.json
            ${{ runner.temp }}/pear-ebusy-report/outcome.json
            ${{ runner.temp }}/pear-ebusy-report/diagnostic-head.txt
          if-no-files-found: warn
          retention-days: 14
