name: Native runner diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-stdio:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.x
      - name: Probe asynchronous PowerShell stdin
        run: node scripts/windows-powershell-stdio-diagnostic.cjs
      - name: Probe synchronous ACL fixture
        run: node scripts/windows-fixture-acl-diagnostic.cjs
  native-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PEAR_MUSIC_NATIVE_TRACE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
      - name: Linux native controls
        if: runner.os == 'Linux'
        run: xvfb-run -a node node_modules/@playwright/test/cli.js test tests/api-music-native.test.ts tests/i18n-built-native.test.ts --workers=1 --reporter=line --repeat-each=2
      - name: macOS native controls
        if: runner.os == 'macOS'
        run: node node_modules/@playwright/test/cli.js test tests/api-music-native.test.ts tests/i18n-built-native.test.ts --workers=1 --reporter=line --repeat-each=2
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: native-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
