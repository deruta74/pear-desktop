<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Pear Desktop Benchmark</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #161916;
      color: #f6f4e9;
      font:
        16px/1.4 system-ui,
        sans-serif;
    }
    header {
      padding: 26px 36px;
      border-bottom: 1px solid #383e36;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 36px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 28px;
    }
    ul {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 0;
      list-style: none;
    }
    li {
      background: #222822;
      padding: 12px;
      border-radius: 8px;
    }
    .cover {
      aspect-ratio: 1.5;
      border-radius: 4px;
      background: linear-gradient(135deg, #2e5042, #acc47c);
    }
    li:nth-child(2n) .cover {
      background: linear-gradient(135deg, #383650, #a18ba8);
    }
    li:nth-child(3n) .cover {
      background: linear-gradient(135deg, #62473c, #d6996a);
    }
    p {
      margin: 10px 0 2px;
    }
  </style>
  <header>Pear Desktop Benchmark</header>
  <main>
    <h1>Albums</h1>
    <ul>
      <li>
        <div class="cover"></div>
        <p>After the Rain</p>
      </li>
      <li>
        <div class="cover"></div>
        <p>Amber Lines</p>
      </li>
      <li>
        <div class="cover"></div>
        <p>Open Water</p>
      </li>
      <li>
        <div class="cover"></div>
        <p>Evening Walk</p>
      </li>
      <li>
        <div class="cover"></div>
        <p>Quiet Streets</p>
      </li>
      <li>
        <div class="cover"></div>
        <p>Before Sunrise</p>
      </li>
      <li>
        <div class="cover"></div>
        <p>Across the Valley</p>
      </li>
      <li>
        <div class="cover"></div>
        <p>Late September</p>
      </li>
    </ul>
  </main>
</html>
