<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pear Queue</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/controls.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <h1>Pear</h1>
      </header>

      <section class="selection" aria-labelledby="selection-heading">
        <div class="selection-heading">
          <h2 id="selection-heading">Current video</h2>
          <span id="position" class="position"></span>
        </div>
        <div class="selection-media">
          <img
            id="selection-artwork"
            class="selection-artwork"
            width="72"
            height="54"
            alt=""
            decoding="async"
            referrerpolicy="no-referrer"
            hidden
          />
          <div class="selection-description">
            <p
              id="selection-id"
              class="selection-title"
              dir="auto"
              aria-live="polite"
            >
              No video selected
            </p>
          </div>
        </div>
        <div class="playback-actions">
          <button
            id="previous"
            class="icon-button"
            type="button"
            aria-label="Previous video"
            title="Previous video"
            disabled
          >
            <span class="skip-icon" aria-hidden="true"></span>
          </button>
          <button
            id="play-toggle"
            class="icon-button play-toggle"
            type="button"
            aria-label="Play video"
            aria-describedby="transport-hint"
            title="Play video"
            hidden
            disabled
          >
            <span class="play-icon" aria-hidden="true"></span>
          </button>
          <button
            id="next"
            class="icon-button"
            type="button"
            aria-label="Next video"
            title="Next video"
            disabled
          >
            <span class="skip-icon skip-icon-next" aria-hidden="true"></span>
          </button>
          <button
            id="open-browser"
            class="browser-button"
            type="button"
            disabled
          >
            Open in browser
            <span class="external-icon" aria-hidden="true"></span>
          </button>
        </div>
        <div id="transport-timeline" class="transport-timeline" hidden>
          <span id="elapsed" aria-hidden="true"></span>
          <input
            id="playback-position"
            type="range"
            min="0"
            step="1"
            aria-label="Playback position"
            disabled
          />
          <span id="duration" aria-hidden="true"></span>
        </div>
        <p id="transport-hint" class="feedback" aria-live="polite"></p>
        <p id="player-problem" class="feedback error" role="alert"></p>
        <p id="metadata-problem" class="feedback" aria-live="polite"></p>
      </section>

      <form id="add-video">
        <label for="video-source">YouTube link or video ID</label>
        <div class="add-controls">
          <textarea
            id="video-source"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Paste links or IDs, one per line"
            aria-describedby="queue-error"
            rows="2"
            required
            disabled
          ></textarea>
          <button id="add-button" class="add-button" type="submit" disabled>
            Add
          </button>
        </div>
        <p id="queue-error" class="feedback error" role="alert"></p>
        <p id="queue-status" class="feedback" role="status">Loading queue…</p>
      </form>

      <section id="queue-panel" class="queue" aria-labelledby="queue-heading">
        <div class="queue-toolbar">
          <div class="queue-heading">
            <h2 id="queue-heading">Queue</h2>
            <span
              id="queue-count"
              class="queue-count"
              aria-live="polite"
            ></span>
          </div>
          <input
            id="queue-filter"
            class="queue-filter"
            type="search"
            aria-label="Filter queue"
            aria-controls="queue-items"
            placeholder="Filter queue"
            autocomplete="off"
            spellcheck="false"
            maxlength="180"
            hidden
          />
        </div>
        <p id="queue-empty" class="queue-empty" hidden>
          Add a YouTube video to start your queue.
        </p>
        <ol
          id="queue-items"
          class="queue-items"
          role="list"
          aria-labelledby="queue-heading"
          hidden
        ></ol>
      </section>

      <template id="view-switcher-template">
        <nav class="view-switcher">
          <button
            id="show-queue"
            type="button"
            aria-controls="add-video queue-panel"
            aria-pressed="true"
          >
            Queue
          </button>
          <button
            id="show-search"
            type="button"
            aria-controls="catalog-form catalog-results"
            aria-pressed="false"
          >
            Search
          </button>
          <button
            id="show-lyrics"
            type="button"
            aria-controls="lyrics-form lyrics-lines"
            aria-pressed="false"
          >
            Lyrics
          </button>
          <button
            id="show-library"
            type="button"
            aria-controls="library-panel"
            aria-pressed="false"
          >
            Library
          </button>
        </nav>
      </template>

      <template id="catalog-template">
        <form id="catalog-form" hidden>
          <label for="catalog-query">Search YouTube</label>
          <div class="add-controls">
            <input
              id="catalog-query"
              type="search"
              autocomplete="off"
              aria-describedby="catalog-feedback"
              required
            />
            <button class="add-button" type="submit">Search</button>
          </div>
          <p id="catalog-feedback" class="feedback" aria-live="polite"></p>
          <p id="catalog-add-feedback" class="feedback" aria-live="polite"></p>
        </form>
        <ul
          id="catalog-results"
          class="queue-items catalog-results"
          role="list"
          aria-label="YouTube results"
          hidden
        ></ul>
      </template>

      <template id="lyrics-template">
        <form id="lyrics-form" hidden>
          <div class="lyrics-fields">
            <div>
              <label for="lyrics-track">Track</label>
              <input
                id="lyrics-track"
                type="text"
                dir="auto"
                autocomplete="off"
                aria-describedby="lyrics-feedback"
                required
              />
            </div>
            <div>
              <label for="lyrics-artist">Artist</label>
              <input
                id="lyrics-artist"
                type="text"
                dir="auto"
                autocomplete="off"
                aria-describedby="lyrics-feedback"
                required
              />
            </div>
            <button class="add-button" type="submit">Find lyrics</button>
          </div>
          <p class="lyrics-attribution">Lyrics from LRCLIB</p>
          <p id="lyrics-feedback" class="feedback" aria-live="polite"></p>
        </form>
        <ol
          id="lyrics-lines"
          class="queue-items lyrics-lines"
          role="list"
          aria-label="Lyrics"
          tabindex="0"
          hidden
        ></ol>
      </template>

      <template id="library-template">
        <section id="library-panel" class="library" aria-label="Library" hidden>
          <div class="library-toolbar">
            <div id="playlist-browser">
              <h2 id="playlist-heading" tabindex="-1">Saved playlists</h2>
              <form id="save-playlist" class="playlist-form" novalidate>
                <label for="save-playlist-name">Playlist name</label>
                <div class="add-controls">
                  <input
                    id="save-playlist-name"
                    type="text"
                    dir="auto"
                    autocomplete="off"
                    aria-describedby="library-problem library-feedback"
                    required
                  />
                  <button
                    id="save-playlist-button"
                    class="add-button"
                    type="submit"
                  >
                    Save queue
                  </button>
                </div>
              </form>
            </div>
            <div id="playlist-detail" hidden>
              <div class="playlist-heading">
                <button id="close-playlist" type="button">
                  Back to playlists
                </button>
                <h2
                  id="playlist-title"
                  class="queue-title"
                  tabindex="-1"
                  dir="auto"
                ></h2>
              </div>
              <div id="playlist-actions" class="playlist-actions">
                <button id="append-playlist" class="add-button" type="button">
                  Add to queue
                </button>
                <button id="edit-playlist" type="button">Rename</button>
                <button id="delete-playlist" type="button">Remove</button>
              </div>
              <form
                id="rename-playlist"
                class="playlist-form"
                novalidate
                hidden
              >
                <label for="rename-playlist-name">Playlist name</label>
                <div class="add-controls">
                  <input
                    id="rename-playlist-name"
                    type="text"
                    dir="auto"
                    autocomplete="off"
                    aria-describedby="library-problem library-feedback"
                    required
                  />
                  <button
                    id="rename-playlist-button"
                    class="add-button"
                    type="submit"
                  >
                    Save name
                  </button>
                  <button id="cancel-rename" type="button">Cancel</button>
                </div>
              </form>
              <div
                id="confirm-playlist-removal"
                class="playlist-form"
                role="group"
                aria-labelledby="remove-playlist-question"
                hidden
              >
                <p id="remove-playlist-question">Remove this playlist?</p>
                <div class="playlist-actions">
                  <button id="cancel-removal" type="button">Cancel</button>
                  <button
                    id="remove-playlist-button"
                    class="playlist-remove"
                    type="button"
                  >
                    Remove playlist
                  </button>
                </div>
              </div>
            </div>
            <p id="library-problem" class="feedback error" role="alert"></p>
            <p id="library-feedback" class="feedback" aria-live="polite"></p>
          </div>
          <p id="library-empty" class="queue-empty" hidden>
            No saved playlists yet.
          </p>
          <ul
            id="saved-playlists"
            class="queue-items playlist-list"
            role="list"
            aria-labelledby="playlist-heading"
            hidden
          ></ul>
          <ol
            id="playlist-tracks"
            class="queue-items playlist-list"
            role="list"
            aria-label="Playlist tracks"
            hidden
          ></ol>
        </section>
      </template>
    </main>
  </body>
</html>
