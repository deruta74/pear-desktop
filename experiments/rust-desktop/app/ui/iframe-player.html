<!doctype html>
<html lang="en" data-wrapper-url="{WRAPPER_URL}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; frame-src https://www.youtube.com{EMBED_PATH}; script-src 'sha256-b8tHb++1vs6XMmEs14W/LUAlskEkDwP2cB1Zab/Odh4=' https://www.youtube.com/iframe_api https://www.youtube.com/s/player/; style-src 'sha256-BexbirapT3Aq0wKKdNcQg3fDFayjIhlBcnQ6SJRpPdU='">
  <title>YouTube player</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    iframe { display: block; width: 100%; height: 100%; min-width: 200px; min-height: 200px; border: 0; }
  </style>
</head>
<body>
  <iframe id="player" title="YouTube video player" src="{PLAYER_URL}"
          referrerpolicy="strict-origin-when-cross-origin"
          sandbox="allow-scripts allow-same-origin allow-presentation"
          allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
  <script>
    (() => {
      const wrapperUrl = document.documentElement.dataset.wrapperUrl;
      const wrapperOrigin = new URL(wrapperUrl).origin;
      const isWrapper = () =>
        self === top && self.origin === wrapperOrigin && document.URL === wrapperUrl && document.baseURI === wrapperUrl;
      if (!isWrapper()) return;

      const frame = document.getElementById('player');
      const initialSrc = frame.src;
      const maxSeconds = 31 * 24 * 60 * 60;
      const states = [-1, 0, 1, 2, 3, 5];
      const errorCodes = [2, 5, 100, 101, 150, 153];
      let player;
      let ready = false;
      let hasPlayed = false;
      let state = null;
      let ended = false;
      let error = null;
      let blocked = false;
      let playedVideoId = null;
      let pendingAdvance = null;

      const fail = () => { error ??= -1; };

      document.addEventListener('securitypolicyviolation', (event) => {
        if (event.effectiveDirective === 'script-src-elem' || event.effectiveDirective === 'frame-src') fail();
      });
      document.addEventListener('error', (event) => {
        if (event.target instanceof HTMLScriptElement) fail();
      }, true);

      window.onYouTubeIframeAPIReady = () => {
        if (!isWrapper() || player) return;
        try {
          player = new YT.Player(frame, { events: {
            onReady: () => { ready = true; },
            onStateChange: ({ data }) => observeState(data),
            onError: ({ data }) => { error ??= errorCodes.includes(data) ? data : -1; },
            onAutoplayBlocked: () => { blocked = true; },
          }});
        } catch {
          fail();
        }
      };

      function validVideoId(id) {
        return typeof id === 'string' && id.length === 11 && !/[^A-Za-z0-9_-]/.test(id);
      }

      function reportedVideoId() {
        try {
          const url = new URL(player.getVideoUrl());
          if (url.origin !== 'https://www.youtube.com' || url.pathname !== '/watch'
              || url.username || url.password) return null;
          const ids = url.searchParams.getAll('v');
          return ids.length === 1 && validVideoId(ids[0]) ? ids[0] : null;
        } catch {
          return null;
        }
      }

      function observeState(data, videoId = data === 1 ? reportedVideoId() : null) {
        if (!states.includes(data)) return;
        if (pendingAdvance !== null) {
          if (data !== 1 || videoId !== pendingAdvance.from) pendingAdvance.sourcePlayback = null;
          // Events identify the player, so only the requested video can end the handoff.
          if (data !== 1 || videoId !== pendingAdvance.to) return;
          pendingAdvance = null;
        }
        state = data;
        if (data === 1) {
          hasPlayed = true;
          playedVideoId = videoId;
          ended = false;
          blocked = false;
        }
        if (data === 0 && hasPlayed) ended = true;
      }

      function frameVisible() {
        if (!frame.isConnected || document.visibilityState !== 'visible') return false;
        const box = frame.getBoundingClientRect();
        const width = Math.max(0, Math.min(box.right, innerWidth) - Math.max(box.left, 0));
        const height = Math.max(0, Math.min(box.bottom, innerHeight) - Math.max(box.top, 0));
        return box.width >= 200 && box.height >= 200 && width * height > box.width * box.height / 2;
      }

      function boundedSeconds(value) {
        return Number.isFinite(value) && value >= 0 && value <= maxSeconds ? value : null;
      }

      function observeAdvance(videoId) {
        const pending = pendingAdvance;
        const playing = (videoId === pending.from || videoId === pending.to)
          && player.getPlayerState() === 1;
        if (playing && videoId === pending.to) {
          // The identity may arrive after the state-change event.
          observeState(1, videoId);
          return false;
        }

        const position = playing ? boundedSeconds(player.getCurrentTime()) : null;
        if (position === null) {
          pending.sourcePlayback = null;
          return false;
        }
        const previous = pending.sourcePlayback;
        // An isolated PLAYING observation can belong to a stale event.
        const replayed = previous !== null && position >= previous.position
          && (previous.replayed || position - previous.position >= 0.1);
        pending.sourcePlayback = { position, replayed };
        return replayed;
      }

      function snapshot() {
        if (!isWrapper()) return null;
        const videoId = ready ? reportedVideoId() : null;
        let position = null;
        let positionMs = null;
        let playbackRate = null;
        let duration = null;
        let sourceReplayed = false;
        if (ready && error === null) {
          try {
            if (pendingAdvance !== null) sourceReplayed = observeAdvance(videoId);
            if (pendingAdvance === null) {
              if (state === 1 && videoId !== null) playedVideoId = videoId;
              const length = boundedSeconds(player.getDuration());
              const time = boundedSeconds(player.getCurrentTime());
              const rate = player.getPlaybackRate();
              if (Number.isFinite(rate) && rate >= 0.25 && rate <= 4) playbackRate = rate;
              if (length > 0) duration = Math.ceil(length);
              if (time !== null) {
                positionMs = Math.floor(Math.min(time, duration ?? maxSeconds) * 1000);
                position = Math.floor(positionMs / 1000);
              }
            }
          } catch {
            fail();
          }
        }
        return {
          ready, videoId, sourceReplayed, hasPlayed: ready && hasPlayed, state: ready ? state : null,
          position, positionMs, playbackRate, duration, ended: ready && ended, error, blocked,
        };
      }

      function command(apply) {
        // The viewer starts playback using the official player's visible controls.
        if (!isWrapper() || !ready || !hasPlayed || blocked || error !== null) return;
        try {
          apply();
        } catch {
          fail();
        }
      }

      function advance(from, to) {
        if (!validVideoId(from) || !validVideoId(to) || from === to) return;
        command(() => {
          if (pendingAdvance !== null || !ended || state !== 0 || playedVideoId !== from
              || reportedVideoId() !== from || player.getPlayerState() !== 0 || !frameVisible()
              || player.getIframe() !== frame || frame.src !== initialSrc) return;
          pendingAdvance = { from, to, sourcePlayback: null };
          hasPlayed = false;
          playedVideoId = null;
          state = null;
          ended = false;
          player.loadVideoById({ videoId: to });
        });
      }

      Object.defineProperty(window, 'pearIframePlayer', { value: Object.freeze({
        snapshot,
        advance,
        play: () => command(() => player.playVideo()),
        pause: () => command(() => player.pauseVideo()),
        seek: (seconds) => {
          if (!Number.isInteger(seconds) || seconds < 0 || seconds > maxSeconds) return;
          command(() => {
            const duration = boundedSeconds(player.getDuration());
            if (duration > 0) {
              const position = seconds < duration ? seconds : Math.max(0, duration - 1);
              player.seekTo(position, true);
            }
          });
        },
      }) });
    })();
  </script>
  <script async src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
