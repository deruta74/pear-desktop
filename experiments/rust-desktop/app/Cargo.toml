[package]
name = "pear-desktop-preview"
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"

[features]
benchmark = []

[dependencies]
html-escape = "0.2"
# Keep HTTP wire logging disabled, including headers and query strings.
log = { version = "0.4", features = ["max_level_info"] }
muda = "0.22"
open = "5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.38"
ureq = { version = "3.5", default-features = false, features = ["gzip", "native-tls-no-default"] }
url = "2.5"
wry = "0.58"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.19"
webkit2gtk = { version = "3", features = ["v2_20"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString"] }
