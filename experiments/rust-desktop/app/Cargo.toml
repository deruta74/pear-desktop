[package]
name = "pear-desktop-preview"
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"

[features]
benchmark = []

[dependencies]
muda = "0.22"
open = "5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.38"
url = "2.5"
wry = "0.58"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.19"
webkit2gtk = { version = "3", features = ["v2_20"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString"] }
