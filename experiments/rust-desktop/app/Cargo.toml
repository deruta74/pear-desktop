[package]
name = "pear-desktop-preview"
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"

[features]
benchmark = []

[dependencies]
cpal = "0.17.3"
fastrand = "2"
html-escape = "0.2"
hound = "3.5.1"
# Keep HTTP wire logging disabled, including headers and query strings.
log = { version = "0.4", features = ["max_level_info"] }
muda = "0.22"
open = "5.4"
pear-preview-dsp = { path = "../dsp" }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
tao = "0.38"
ureq = { version = "3.5", default-features = false, features = ["gzip", "native-tls-no-default"] }
url = "2.5"
wry = "0.58"
symphonia = { version = "0.6.1", default-features = false, features = ["flac"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.18", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.19"
webkit2gtk = { version = "3", features = ["v2_20"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString"] }
